<!doctype html>
<html lang="en">
  <head>
    <title>Clong</title>

    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1"
    />

    <link rel="stylesheet" href="/assets/styles/styles.css" />
  </head>
  <body>
    <div id="start-button">
      <button class="btn">Start Game</button>
    </div>

    <p id="intro" class="text-center">
      Swipe up to shoot balls at targets on big screen
    </p>
    <p id="reconnecting-msg" class="text-center" hidden>Reconnecting...</p>

    <div id="main"></div>

    <div id="spinner"><div class="loader"></div></div>

    <div class="hud">
      <div id="timer"><span id="sec-num">60</span> sec</div>
      <div id="score"><span id="score-num">0</span> points</div>
    </div>

    <script src="/assets/scripts/helpers.js"></script>
    <script src="/assets/scripts/controller.js"></script>
  </body>
</html>
