services:
  clong:
    build: .
    ports:
      - 8080:8080
    depends_on:
      db:
        condition: service_healthy
    environment:
      CLONG_DATABASE_URL: postgresql://postgres:clong@db?sslmode=disable
      CLONG_ADMIN_PASSWORD: ${CLONG_ADMIN_PASSWORD:-clong}
  db:
    image: docker.io/library/postgres:18
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: clong
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
