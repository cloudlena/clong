apiVersion: apps/v1
kind: Deployment
metadata:
  name: clong-db
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: clong-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clong-db
    spec:
      containers:
        - name: db
          image: docker.io/library/postgres:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: clong
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: clong-credentials
                  key: dbUsername
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clong-credentials
                  key: dbPassword
