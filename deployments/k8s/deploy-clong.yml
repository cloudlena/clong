apiVersion: apps/v1
kind: Deployment
metadata:
  name: clong
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: clong
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clong
    spec:
      containers:
        - name: clong
          image: docker.io/cloudlena/clong:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          env:
            - name: CLONG_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clong-credentials
                  key: adminPassword
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: clong-credentials
                  key: dbUsername
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clong-credentials
                  key: dbPassword
            - name: CLONG_DATABASE_URL
              value: postgresql://$(DB_USERNAME):$(DB_PASSWORD)@clong-db?sslmode=disable
