apiVersion: apps/v1
kind: Deployment
metadata:
  name: clong
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: clong
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clong
    spec:
      containers:
        - name: clong
          image: cloudlena/clong:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clong-credentials
                  key: adminPassword
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: clong-credentials
                  key: dbUsername
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clong-credentials
                  key: dbPassword
            - name: DATABASE_URL
              value: postgresql://$(DB_USERNAME):$(DB_PASSWORD)@clong-db/clong?sslmode=disable
