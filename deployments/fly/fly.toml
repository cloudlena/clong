app = 'bespinian-clong'
primary_region = 'ams'

# Relative to this file
[build]
  dockerfile = '../../Containerfile'

[http_service]
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = 'GET'
    path = '/healthz'
    interval = '15s'
    timeout = '2s'
    grace_period = '5s'

[[vm]]
  memory = '256MB'
  cpu_kind = 'shared'
  cpus = 1
